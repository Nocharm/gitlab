# GitLab CE — 71서버 운영 인스턴스. 데이터는 named 볼륨에 영속.
services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: unless-stopped
    hostname: ${GITLAB_HOSTNAME}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME}:${GITLAB_HTTP_PORT}'
        nginx['listen_port'] = 80          # 내부 nginx는 80에서 listen — external 포트와 분리(프록시 뒤로 인식)
        nginx['listen_https'] = false
        # --- Puma: 워커 수 고정(자동 산정 off) ---
        # 자동 산정은 호스트 코어 수를 따라가 워커가 과다 생성된다. 워커당 RSS ~1GB+ 라
        # 서버 메모리가 위험 수준까지 올라가서, 코어 수와 무관하게 8로 고정한다.
        puma['worker_processes'] = 8
        # --- Keycloak OIDC SSO (값은 .env. 패스워드 로그인은 끄지 않음 = 병행) ---
        gitlab_rails['omniauth_enabled'] = true
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']   # 미등록 유저의 자동 계정 생성 허용 provider
        gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']         # 이메일 일치 시 기존 유저에 연결(기존 계정 보존)
        gitlab_rails['omniauth_block_auto_created_users'] = true             # 처음 보는 외부 유저는 관리자 승인 전까지 차단(안전 기본)
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'openid_connect',
            label: 'Keycloak',
            args: {
              issuer: '${KEYCLOAK_ISSUER}',
              # discovery off: http Keycloak 에서 discovery(.well-known) 단계가 https 로 붙어
              # 'SSL record layer failure' 나는 문제 회피. 엔드포인트를 issuer(스킴 포함) 기준으로
              # 명시 → 전송 스킴이 issuer 와 동일(http) 보장. Keycloak 경로는 표준값.
              discovery: false,
              client_auth_method: 'basic',           # Keycloak 'Client Id and Secret' = client_secret_basic
              uid_field: 'preferred_username',
              scope: ['openid', 'profile', 'email'],
              client_options: {
                identifier: '${KEYCLOAK_CLIENT_ID}',
                secret: '${KEYCLOAK_CLIENT_SECRET}',
                redirect_uri: 'http://${GITLAB_HOSTNAME}:${GITLAB_HTTP_PORT}/users/auth/openid_connect/callback',
                authorization_endpoint: '${KEYCLOAK_ISSUER}/protocol/openid-connect/auth',
                token_endpoint: '${KEYCLOAK_ISSUER}/protocol/openid-connect/token',
                userinfo_endpoint: '${KEYCLOAK_ISSUER}/protocol/openid-connect/userinfo',
                jwks_uri: '${KEYCLOAK_ISSUER}/protocol/openid-connect/certs',
                end_session_endpoint: '${KEYCLOAK_ISSUER}/protocol/openid-connect/logout'
              }
            }
          }
        ]
    ports:
      - "${GITLAB_HTTP_PORT}:80"          # host 공개포트 → 컨테이너 nginx 80 (git clone은 http)
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: "256m"

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
