# GitLab CE — 71서버 운영 인스턴스. 데이터는 named 볼륨에 영속.
services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: unless-stopped
    hostname: ${GITLAB_HOSTNAME}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME}:${GITLAB_HTTP_PORT}'
        nginx['listen_port'] = 80          # 내부 nginx는 80에서 listen — external 포트와 분리(프록시 뒤로 인식)
        nginx['listen_https'] = false
    ports:
      - "${GITLAB_HTTP_PORT}:80"          # host 공개포트 → 컨테이너 nginx 80 (git clone은 http)
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: "256m"

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
