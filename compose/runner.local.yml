# 로컬(mac Docker Desktop) 테스트용 오버라이드. 서버용 runner.compose.yml은 그대로 두고 덧댄다:
#   docker compose --env-file .env -f compose/runner.compose.yml -f compose/runner.local.yml up -d --build
# 차이: mac은 /srv 바인드 불가 → registry를 named 볼륨으로. (host-gateway 매핑은 base에 이미 있음)
services:
  runner:
    volumes:
      - deploy_registry:/srv/deploy          # 같은 mount target(/srv/deploy)이라 base 바인드를 대체

volumes:
  deploy_registry:
