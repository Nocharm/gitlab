<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{width:1320px;height:880px;background:#e9eaee;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cell{background:#fff;border:1px solid #d8d9dd;border-radius:10px;overflow:hidden}
.cap{font-size:13px;font-weight:600;color:#44454b;padding:8px 12px;border-bottom:1px solid #ededf0}
img{width:100%;display:block}
</style></head><body><div class="grid">
<div class="cell"><div class="cap">Candidate 1 — base orange, faint tint</div><img src="cand-1.png"></div>
<div class="cell"><div class="cap">Candidate 2 — soft, lightest tint</div><img src="cand-2.png"></div>
<div class="cell"><div class="cap">Candidate 3 — warm, deeper orange + stronger gradient</div><img src="cand-3.png"></div>
<div class="cell"><div class="cap">Candidate 4 — purple-lean gradient, orange accent</div><img src="cand-4.png"></div>
</div></body></html>
